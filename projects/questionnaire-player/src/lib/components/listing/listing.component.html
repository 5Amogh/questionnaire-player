<div class="content" *ngIf="loaded">
    <div class="list-title">
      <div>
        <h1 class="heading">{{pageTitle}}</h1>
        <p class="heading-paragraph">Access and record your observations easily and plan your improvement journeys</p>
      </div>

      <div class="srch" *ngIf="!reportPage">
        <mat-form-field class="srchBar" style="background-color: white; border-radius: 16px;">
          <mat-icon matPrefix style="color: gray;">search</mat-icon>
          <input 
            matInput 
            [(ngModel)]="searchTerm" 
            (input)="handleInput($event)" 
            placeholder="Search your observation here" 
            class="search" 
          />
          <button *ngIf="searchTerm" matSuffix mat-icon-button aria-label="Clear" (click)="handleInput()">
            <mat-icon style="color: gray;">close</mat-icon>
          </button>
        </mat-form-field>
      </div>
      
    </div>
  
    <div class="observation-list" *ngIf="solutionList?.count !== 0">

     <div class="select-filter" *ngIf="reportPage">
      <mat-form-field>
        <mat-label>Entity Filter</mat-label>
        <mat-select (selectionChange)="changeEntityType($event.value)" [(ngModel)]="selectedEntityType">
          <mat-option *ngFor="let item of entityType" [value]="item">
            {{ item }}
          </mat-option>
        </mat-select>
      </mat-form-field>
     </div>

        <div class="grid-container">
          <div class="grid-item" *ngFor="let solution of solutionList?.data" (click)="navigateTo(solution)">
            <mat-card class="observation-card">
              <mat-card-content>
                <h2 class="observation-name">{{ solution?.name }}</h2>
                <p>{{ reportPage == 'true' ? solution?.programName : solution?.description }}</p>
              </mat-card-content>
            </mat-card>
          </div>
        </div>
    </div>
    <div *ngIf="solutionList?.count === 0" class="no-data-container">
      <img src="/assets/images/no_data.jpg" alt="No data" />
    </div>
    <!-- <mat-toolbar class="d-flex flex-jc-center flex-ai-center" style="background-color: white;" *ngIf="!(solutionList?.count === 0 || solutionList?.count === solutionList?.data?.length)">
      <button mat-raised-button style="background-color: #832215;color: white;" (click)="loadData()">Load More</button>
    </mat-toolbar> -->

    <div class="fixed-bottom-buttons" *ngIf="!(solutionList?.count === 0 || solutionList?.count === solutionList?.data?.length)">
      <button mat-raised-button color="accent" (click)="loadData()">Load More</button>
    </div>
  </div>

  <div *ngIf="isEntityFilterModalOpen" class="modal">
    <div class="modal-content">
      <header class="d-flex align-items-center">
        <h1 class="modal-title">Select entity</h1>
        <mat-icon class="close-btn" (click)="closeFilter()">close</mat-icon>
      </header>
      <div>
        <ul>
          <li *ngFor="let question of allEntities; let i = index">
            <input type="checkbox" [(ngModel)]="question.selected" class="modal-input" [id]="'question-' + i">
            <label [for]="'question-' + i">
              {{ question.name }}
            </label>
          </li>
        </ul>
      </div>
      <footer class="question-footer">
        <button (click)="applyFilter()" class="apply-filter">Submit</button>
      </footer>
    </div>
  </div>

    <lib-spinner *ngIf="!loaded"></lib-spinner>

<header class="header">
  <div class="toolbar">
    <mat-icon class="back-button" (click)="goBack()">keyboard_backspace</mat-icon>
  </div>
</header>
<ng-container *ngIf="selectedEntities">
  <div class="listTitle">
    <div>
      <h1>{{solutionName}}</h1>
      <p>Select {{selectedEntities?.entityType}} from the list to observe</p>
    </div>

    <div class="srch">
      <mat-form-field class="srchBar" style="background-color: white;border-radius: 16px;">
        <mat-icon matPrefix style="color: gray;">search</mat-icon>
        <input matInput (input)="handleSearchInputOne($event)"
          [placeholder]="'Search '+ selectedEntities?.entityType" class="search" />
      </mat-form-field>
    </div>
  </div>

  <div class="d-flex flex-dc gap-4">
    <button class="add-entity-btn" (click)="openAllEntityList()">Add {{selectedEntities?.entityType}}</button>

    <div class="observation-list">
      <div class="grid-container">
        <div class="grid-item" *ngFor="let entity of filteredEntitiesOne">
          <mat-card class="observation-card" (click)="navigateToDetails(entity)">
            <mat-card-content class="card-content">
              <h2 class="observation-name">{{ entity?.name }}</h2>
              <button *ngIf="entity?.submissionsCount == 0" mat-icon-button color="warn"
                (click)="deleteEntity(entity?._id); $event.stopPropagation()">
                <mat-icon style="color: gray;">delete</mat-icon>
              </button>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #searchEntityModal>
  <div class="p-16 searchEntity">
    <div mat-dialog-title class="d-flex flex-ai-start flex-dr flex-gap-4 p-0 " style="color: var(--primary-color);">
      Add {{entityToAdd}}
    </div>
    <mat-divider></mat-divider>
    <div mat-dialog-content class="flex-ai-self-start">
      <div class="srch">
        <mat-form-field class="srchBar" style="background-color: white;border-radius: 16px;">
          <mat-icon matPrefix style="color: gray;">search</mat-icon>
          <input matInput (input)="handleSearchInput($event)" [placeholder]="'Search '+ selectedEntities.entityType" />
        </mat-form-field>
      </div>

      <mat-selection-list [multiple]="true" [(ngModel)]="addedEntities">
        <mat-list-option *ngFor="let entity of filteredEntities" [value]="entity?._id"
          [disabled]="isEntityInFilteredEntitiesOne(entity)" [selected]="isEntityInFilteredEntitiesOne(entity)">
          {{entity?.name}}
        </mat-list-option>
      </mat-selection-list>
    </div>

    <mat-dialog-actions class="mat-dialog-actions">
      <button mat-button color="primary" [mat-dialog-close]="'yes'" class="primary-btn"
        (click)="submitDialog()">Add</button>
      <button mat-button mat-dialog-close class="btn" (click)="closeDialog()" class="secondary-btn">Cancel</button>
    </mat-dialog-actions>
  </div>
</ng-template>

<ng-template #confirmDialogModel>
  <h1 mat-dialog-title>Confirm Deletion</h1>
  <mat-dialog-content>Are you sure you want to delete this entity?</mat-dialog-content>

  <mat-dialog-actions class="mat-dialog-actions">
    <button mat-button color="primary" [mat-dialog-close]="'yes'" class="primary-btn">Yes</button>
    <button mat-button mat-dialog-close="no" class="secondary-btn">No</button>
  </mat-dialog-actions>
</ng-template>

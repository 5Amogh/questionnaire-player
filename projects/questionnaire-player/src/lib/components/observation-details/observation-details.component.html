<div class="listTitle">
  <div>
    <h1>{{entityName}}</h1>
    <p>Select Observation from the list to observe</p>
  </div>
</div>

<mat-tab-group mat-stretch-tabs="true">
  <mat-tab label="All">
    <div class="observation-list">
      <div class="grid-container">
        <ng-container *ngIf="getObservationsByStatus(['All']).length; else noData">
          <div class="grid-item" *ngFor="let entity of getObservationsByStatus(['All'])">
            <mat-card class="observation-card">
              <mat-card-content>
                <h2 class="observation-name">{{ entity?.title }}</h2>
                <p>{{entity?.updatedAt | date:'short'}}</p>
              </mat-card-content>
            </mat-card>
          </div>
        </ng-container>
        <ng-template #noData>
          <p>No data found</p>
        </ng-template>
      </div>
    </div>
  </mat-tab>
  
  <mat-tab label="In progress"> 
    <div class="observation-list">
      <div class="grid-container">
        <ng-container *ngIf="getObservationsByStatus(['draft', 'started']).length; else noDataInProgress">
          <div class="grid-item" *ngFor="let entity of getObservationsByStatus(['draft', 'started'])">
            <mat-card class="observation-card">
              <mat-card-content>
                <h2 class="observation-name">{{ entity?.title }}</h2>
                <p>status: {{entity?.status}}</p>
              </mat-card-content>
            </mat-card>
          </div>
        </ng-container>
        <ng-template #noDataInProgress>
          <p>No data found</p>
        </ng-template>
      </div>
    </div>
  </mat-tab>
  
  <mat-tab label="Completed"> 
    <div class="observation-list">
      <div class="grid-container">
        <ng-container *ngIf="getObservationsByStatus(['completed']).length; else noDataCompleted">
          <div class="grid-item" *ngFor="let entity of getObservationsByStatus(['completed'])">
            <mat-card class="observation-card">
              <mat-card-content>
                <h2 class="observation-name">{{ entity?.title }}</h2>
                <p>status: {{entity?.status}}</p>
              </mat-card-content>
            </mat-card>
          </div>
        </ng-container>
        <ng-template #noDataCompleted>
          <p>No data found</p>
        </ng-template>
      </div>
    </div>
  </mat-tab>
</mat-tab-group>
